<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haptic Design Lab — Dongwoon Anatech</title>
<meta name="description" content="드라이버는 진동을 만들고, 랩은 감성을 만듭니다. HapTune Studio · SAC Board — 실측 기반 햅틱 튜닝.">
<style>
*{box-sizing:border-box}
:root{
  --ink:#1A2026; --mut:#5C656E; --soft:#8A9099; --amber:#F2B134; --deep:#C07A00;
  --cream:#FBFAF6; --line:#E6E0D2; --dark:#12171D; --dark2:#1C242C;
  --max:1120px;
  --sans:"Inter","Pretendard","Noto Sans KR","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased;word-break:keep-all}
/* keep-all stops Korean words breaking mid-word, but it also forbids breaks
   between Han characters — Chinese must wrap normally. */
html[lang^="zh"] body,html[lang^="zh"] body *{word-break:normal;line-break:normal}
.card,.dcard,.row,.kpi,.stat{min-width:0;overflow-wrap:anywhere}
h1,h2,h3,p,ul,li,figure{margin:0}
a{color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--deep);
  text-transform:uppercase;margin-bottom:14px}
h2{font-size:clamp(28px,4.2vw,44px);font-weight:700;line-height:1.22;letter-spacing:-.01em}
.lead{font-size:clamp(17px,1.9vw,20px);color:var(--mut);margin-top:20px;max-width:62ch}
section{padding:clamp(72px,9vw,124px) 0}
section.alt{background:var(--cream);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
section.dark{background:var(--dark);color:#EDEAE2}
section.dark h2{color:#F3F0E8}
section.dark .lead{color:#A9B3BC}
section.dark .kick{color:var(--amber)}

/* top bar */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--max);margin:0 auto;padding:0 28px;height:62px;display:flex;
  align-items:center;gap:22px}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--deep)}
nav{display:flex;gap:22px}
nav a{font-size:14px;color:var(--mut);text-decoration:none}
nav a:hover{color:var(--ink)}
.langs{display:flex;gap:2px;background:#F0ECE1;border-radius:999px;padding:3px}
.langs button{border:0;background:none;font:inherit;font-size:12.5px;padding:5px 12px;
  border-radius:999px;cursor:pointer;color:var(--mut);white-space:nowrap}
.langs button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* hero */
.hero{padding:clamp(60px,8vw,104px) 0 clamp(56px,7vw,96px)}
.hero h1{font-size:clamp(34px,5.6vw,62px);font-weight:700;line-height:1.16;letter-spacing:-.02em}
.hero .sub{font-size:clamp(16px,1.9vw,19px);color:var(--mut);margin-top:26px;max-width:58ch}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:38px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-size:15px;
  font-weight:600;text-decoration:none;border:1px solid transparent}
.btn.p{background:var(--ink);color:#fff}
.btn.s{border-color:var(--line);color:var(--ink);background:#fff}
.btn:hover{transform:translateY(-1px)}
.markbox{margin-top:clamp(40px,6vw,72px)}
.markbox .m{max-width:560px}
.figcap{font-size:13.5px;color:var(--soft);margin-top:12px}

/* grids */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:52px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,4vw,56px);margin-top:52px;
  align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}
section.alt .card{background:#fff}
.card .n{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--deep)}
.card h3{font-size:19px;font-weight:700;margin-top:14px}
.card p{font-size:15.5px;color:var(--mut);margin-top:10px;line-height:1.62}
.dcard{background:var(--dark2);border-radius:16px;padding:30px;border-top:4px solid var(--amber)}
.dcard .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--amber)}
.dcard h3{font-size:24px;font-weight:700;color:#F3F0E8;margin-top:12px}
.dcard p{font-size:15.5px;color:#A9B3BC;margin-top:12px}
.dcard:nth-child(2){border-top-color:#4DB6C4}.dcard:nth-child(2) .tag{color:#4DB6C4}
.dcard:nth-child(3){border-top-color:#8FD14F}.dcard:nth-child(3) .tag{color:#8FD14F}
.g3.two{grid-template-columns:repeat(2,1fr)}

/* stat */
.stats{display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,64px);margin-top:36px;align-items:flex-end}
.stat .v{font-family:var(--mono);font-size:clamp(34px,5vw,54px);font-weight:600;
  color:var(--amber);line-height:1}
.stat .l{font-size:14.5px;color:#A9B3BC;margin-top:8px}
.stat.mut .v{color:#E07B39}
.arrow{font-size:28px;color:#6E757D;padding-bottom:12px}
.figbox{margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:clamp(20px,3vw,34px)}
section.dark .figbox{background:#1A222B;border-color:#2B333C}

/* lists */
.rows{margin-top:44px;display:grid;gap:14px}
.row{display:flex;gap:18px;padding:20px 24px;background:#fff;border:1px solid var(--line);
  border-radius:14px;align-items:flex-start}
.row .k{font-weight:700;font-size:16.5px;min-width:min(34%,220px)}
.row .d{font-size:15.5px;color:var(--mut)}
.steps{display:flex;flex-wrap:wrap;gap:9px;margin-top:34px}
.steps span{font-size:13.5px;padding:9px 16px;border-radius:999px;background:#1F2933;
  color:#EDEAE2;border:1px solid #2B333C}
.steps span i{font-family:var(--mono);color:var(--amber);font-style:normal;margin-right:7px}
img.shot{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
section.dark img.shot{border-color:#2B333C}
figure{margin:0}
.feelgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
.feelgrid .fb{background:#12171D;border-radius:14px;padding:24px}
.feelgrid h4{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--amber)}
.feelgrid .fb:nth-child(2) h4{color:#4DB6C4}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.kpi{background:var(--dark);border-radius:14px;padding:24px 22px}
.kpi .v{font-family:var(--mono);font-size:clamp(24px,3vw,32px);font-weight:600;color:var(--amber);line-height:1.1}
.kpi .k{font-size:14px;color:#EDEAE2;margin-top:12px;font-weight:600}
.kpi .d{font-size:13px;color:#8A939C;margin-top:6px;line-height:1.5}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}}

/* closing */
.close{background:var(--amber);color:#12171D}
.close h2{color:#12171D}
.close .lead{color:#4A3300}
.close .btn.p{background:#12171D;color:#fff}
.close .btn.s{background:transparent;border-color:#A97A10;color:#4A3300}
footer{padding:34px 0;font-family:var(--mono);font-size:12px;color:var(--soft);
  border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between}
[hidden]{display:none!important}
@media (max-width:860px){
  body{font-size:16px}
  .g3,.g3.two,.g2,.feelgrid{grid-template-columns:1fr}
  nav{display:none}
  .row{flex-direction:column;gap:6px}
  .row .k{min-width:0}
  .bar{gap:12px}
}
</style>
</head>

const HTMLLANG = {ko:"ko", en:"en", zh:"zh-Hans"};
function pick(o, path) {
  return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
}
function apply(lang) {
  const p = PACKS[lang];
  if (!p) return;
  document.documentElement.lang = HTMLLANG[lang] || lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = pick(p, el.getAttribute('data-t'));
    if (typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-fig]').forEach(el => {
    const v = p.fig && p.fig[el.getAttribute('data-fig')];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('.langs button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  try { localStorage.setItem('hdl-lang', lang); } catch (e) {}
}
function initial() {
  const q = new URLSearchParams(location.search).get('lang');
  if (PACKS[q]) return q;
  let saved = null;
  try { saved = localStorage.getItem('hdl-lang'); } catch (e) {}
  if (PACKS[saved]) return saved;
  const n = (navigator.language || 'en').toLowerCase();
  if (n.startsWith('ko')) return 'ko';
  if (n.startsWith('zh')) return 'zh';
  return 'en';
}
document.querySelectorAll('.langs button').forEach(b =>
  b.addEventListener('click', () => apply(b.dataset.lang)));
apply(initial());
</script>
